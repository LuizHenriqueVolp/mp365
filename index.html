    <!-- ============================================================
         TRACKING — configure SOMENTE estas duas linhas.
         utmifyPixelId: ID do pixel criado no painel da UTMify (Integrações → Pixels)
           para o pixel do Meta 984364367619085. Com ele preenchido, a UTMify envia
           PageView, ViewContent, InitiateCheckout (clique no checkout) e Purchase
           (venda aprovada na Cakto) ao Meta pelo navegador + API de Conversões,
           com deduplicação. NÃO carregue o pixel do Meta junto (duplicaria eventos).
         Vazio: usa o pixel do Meta direto e o site dispara ViewContent e InitiateCheckout.
         ============================================================ -->
    <script>
      window.MP365_TRACKING = { metaPixelId: "984364367619085", utmifyPixelId: "" };
      (function (t) {
        if (t.utmifyPixelId) {
          window.pixelId = t.utmifyPixelId;
          var s = document.createElement("script");
          s.src = "https://cdn.utmify.com.br/scripts/pixel/pixel.js"; s.async = true; s.defer = true;
          document.head.appendChild(s);
          return;
        }
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        // O back redirect usa history.pushState: sem isto o Meta contaria PageViews falsos.
        fbq.disablePushState = true;
        fbq('init', t.metaPixelId);
        fbq('track', 'PageView');
      })(window.MP365_TRACKING);
    </script>
